[project]
name = "kilocode-tg-bot"
version = "0.1.0"
description = "Telegram bot (aiogram) acting as a remote control for a KiloCode headless server via kilocode-client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "kilocode-client>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "ruff>=0.5",
]

[project.scripts]
kilocode-tg-bot = "kilocode_tg_bot.bot:main"

[tool.setuptools.packages.find]
include = ["kilocode_tg_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["kilocode_tg_bot"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]