[project]
name = "kilocode-tg-bot"
version = "0.1.0"
description = "Telegram bot (aiogram) acting as a remote control for a KiloCode headless server via kilocode-client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "aiogram>=3.0",
    "aiohttp-socks>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "kilocode-client>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.25",
    "ruff>=0.5",
    "ty>=0.0.1",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=2.0",
    "furo",
]

[project.scripts]
kilocode-tg-bot = "kilocode_tg_bot.bot:main"

[tool.setuptools.packages.find]
include = ["kilocode_tg_bot*"]

[tool.setuptools.package-data]
kilocode_tg_bot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: integration tests that hit a real `kilo serve` (require KILO_SERVER_URL)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["kilocode_tg_bot"]
omit = [
    "kilocode_tg_bot/handlers/__init__.py",
    "kilocode_tg_bot/middlewares/__init__.py",
    "kilocode_tg_bot/services/__init__.py",
    "kilocode_tg_bot/state/__init__.py",
    "kilocode_tg_bot/keyboards/__init__.py",
    "kilocode_tg_bot/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["kilocode_tg_bot"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]